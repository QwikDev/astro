name: Publish Any Commit
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦️ Install Panam
        run: pnpm i -g panam-cli

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - run: make pr-release
